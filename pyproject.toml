[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "preflight-ai"
version = "0.1.1"
description = "AI-powered code review before you open a PR"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Jinsung Park"}
]
keywords = ["code-review", "ai", "git", "cli", "anthropic", "claude", "pull-request"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.25.0",
    "pydantic>=2.0",
    "click>=8.0",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "chromadb>=0.4.0",
    "PyGithub>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/jsliapark/preflight"
Repository = "https://github.com/jsliapark/preflight"
Issues = "https://github.com/jsliapark/preflight/issues"

[project.scripts]
preflight = "core.cli:main"

[tool.setuptools]
packages = ["core", "agents", "prompts"]
package-data = {"prompts" = ["*.md"]}

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["."]